name: Update Profile Assets

on:
  schedule:
    # Daily at 02:00 UTC (10:00 CST)
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate active stack and release SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
          OUT_DIR: dist
        run: python3 scripts/generate_cards.py

      - name: Generate contribution snake SVGs (light & dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=gitlab-light
            dist/snake-dark.svg?palette=gitlab-dark

      - name: Post-process snake SVGs (dot border radius 4.5px)
        run: |
          python3 - <<'EOF'
          import pathlib
          for name in ("dist/snake-light.svg", "dist/snake-dark.svg"):
              p = pathlib.Path(name)
              s = p.read_text(encoding="utf-8")
              s = s.replace('rx="2" ry="2"', 'rx="4.5" ry="4.5"')
              p.write_text(s, encoding="utf-8")
          EOF

      - name: Publish generated SVGs to orphan output branch
        run: |
          cd dist
          git init
          git checkout -B output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update generated profile SVGs"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
